---
- name: Deploy tms_new to the existing single-node K3s cluster
  hosts: k3s_servers
  become: true
  gather_facts: false

  vars_prompt:
    - name: release_tag
      prompt: GitHub release tag to deploy (example v0.1.0)
      private: false
    - name: github_owner
      prompt: GitHub owner for the GHCR images
      private: false
      default: sanaabed41
    - name: ghcr_username
      prompt: GitHub username for GHCR read access
      private: false
      default: sanaabed41
    - name: ghcr_token
      prompt: GitHub PAT with read:packages
      private: true
      confirm: true
    - name: postgres_password
      prompt: New password for the demo PostgreSQL database
      private: true
      confirm: true
    - name: jwt_secret
      prompt: JWT secret (generate with openssl rand -hex 32)
      private: true
      confirm: true

  vars:
    k8s_namespace: tms-new
    remote_dir: /root/tms-new-deploy
    k3s: /usr/local/bin/k3s

  tasks:
    - name: Validate release tag
      ansible.builtin.assert:
        that:
          - release_tag is match('^v[0-9]+\\.[0-9]+\\.[0-9]+$')
        fail_msg: Use a published release tag such as v0.1.0.

    - name: Create protected deployment directory
      ansible.builtin.file:
        path: "{{ remote_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Copy public manifests
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../k8s/"
        dest: "{{ remote_dir }}/"
        owner: root
        group: root
        mode: "0600"

    - name: Render versioned application manifests
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../../k8s/03-apps.yaml.j2"
        dest: "{{ remote_dir }}/03-apps.yaml"
        owner: root
        group: root
        mode: "0600"

    - name: Create namespace
      ansible.builtin.command:
        argv: ["{{ k3s }}", kubectl, apply, -f, "{{ remote_dir }}/00-namespace.yaml"]
      register: namespace_result
      changed_when: "'created' in namespace_result.stdout or 'configured' in namespace_result.stdout"

    - name: Apply non-secret configuration and database manifests
      ansible.builtin.command:
        argv: ["{{ k3s }}", kubectl, apply, -f, "{{ item }}"]
      loop:
        - "{{ remote_dir }}/01-config.yaml"
        - "{{ remote_dir }}/02-postgres.yaml"
      changed_when: false

    - name: Render and apply secrets without logging credentials
      block:
        - name: Render GHCR pull secret
          ansible.builtin.template:
            src: "{{ playbook_dir }}/../templates/ghcr-secret.yaml.j2"
            dest: "{{ remote_dir }}/ghcr-secret.yaml"
            owner: root
            group: root
            mode: "0600"
          no_log: true

        - name: Render application secrets
          ansible.builtin.template:
            src: "{{ playbook_dir }}/../templates/app-secret.yaml.j2"
            dest: "{{ remote_dir }}/app-secret.yaml"
            owner: root
            group: root
            mode: "0600"
          no_log: true

        - name: Apply Kubernetes secrets
          ansible.builtin.command:
            argv: ["{{ k3s }}", kubectl, apply, -f, "{{ item }}"]
          loop:
            - "{{ remote_dir }}/ghcr-secret.yaml"
            - "{{ remote_dir }}/app-secret.yaml"
          no_log: true
      always:
        - name: Remove temporary secret files
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop:
            - "{{ remote_dir }}/ghcr-secret.yaml"
            - "{{ remote_dir }}/app-secret.yaml"

    - name: Wait for PostgreSQL
      ansible.builtin.command:
        argv:
          - "{{ k3s }}"
          - kubectl
          - rollout
          - status
          - statefulset/postgres
          - --namespace
          - "{{ k8s_namespace }}"
          - --timeout=300s
      changed_when: false

    - name: Apply application and ingress
      ansible.builtin.command:
        argv: ["{{ k3s }}", kubectl, apply, -f, "{{ item }}"]
      loop:
        - "{{ remote_dir }}/03-apps.yaml"
        - "{{ remote_dir }}/04-ingress.yaml"
      changed_when: false

    - name: Wait for application deployments
      ansible.builtin.command:
        argv:
          - "{{ k3s }}"
          - kubectl
          - rollout
          - status
          - "deployment/{{ item }}"
          - --namespace
          - "{{ k8s_namespace }}"
          - --timeout=300s
      loop: [backend, frontend]
      changed_when: false

    - name: Show application resources
      ansible.builtin.command:
        argv: ["{{ k3s }}", kubectl, get, pods, services, ingress, --namespace, "{{ k8s_namespace }}", -o, wide]
      register: tms_resources
      changed_when: false

    - name: Display resources
      ansible.builtin.debug:
        var: tms_resources.stdout_lines

    - name: Remove copied manifests
      ansible.builtin.file:
        path: "{{ remote_dir }}"
        state: absent
